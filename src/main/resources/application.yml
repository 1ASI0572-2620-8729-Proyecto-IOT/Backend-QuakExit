spring:
  application:
    name: quakexit
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    properties:
      hibernate:
        jdbc.time_zone: America/Lima
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  jackson:
    time-zone: America/Lima
server:
  port: ${PORT:8080}
app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    full-name: ${ADMIN_FULL_NAME}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
  seismic:
    consecutive-readings: ${SEISMIC_CONSECUTIVE_READINGS:3}
    window-seconds: ${SEISMIC_WINDOW_SECONDS:15}
  maintenance:
    low-battery-threshold: ${MAINTENANCE_LOW_BATTERY_THRESHOLD:20}
    offline-hours: ${MAINTENANCE_OFFLINE_HOURS:24}
    scan-interval-ms: ${MAINTENANCE_SCAN_INTERVAL_MS:300000}
  notifications:
    provider: ${NOTIFICATION_PROVIDER:none}
  payments:
    simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:true}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
