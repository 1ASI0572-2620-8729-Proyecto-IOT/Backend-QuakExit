spring:
  application:
    name: quakexit
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/terraguard_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456789}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Solo desarrollo. Produccion debe usar Flyway/Liquibase y ddl-auto: validate.
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        jdbc.time_zone: America/Lima
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  jackson:
    time-zone: America/Lima
server:
  port: ${PORT:8080}
app:
  admin:
    email: ${ADMIN_EMAIL:admin@quakexit.io}
    password: ${ADMIN_PASSWORD:Admin123}
    full-name: ${ADMIN_FULL_NAME:QuakExit Administrator}
  jwt:
    secret: ${JWT_SECRET:VGhlcmFndWFyZFF1YWtFeGl0U2VjcmV0S2V5Rm9yRGV2T25seQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seismic:
    consecutive-readings: ${SEISMIC_CONSECUTIVE_READINGS:3}
    window-seconds: ${SEISMIC_WINDOW_SECONDS:15}
  maintenance:
    low-battery-threshold: ${MAINTENANCE_LOW_BATTERY_THRESHOLD:20}
    offline-hours: ${MAINTENANCE_OFFLINE_HOURS:24}
    scan-interval-ms: ${MAINTENANCE_SCAN_INTERVAL_MS:300000}
  notifications:
    provider: ${NOTIFICATION_PROVIDER:none}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
